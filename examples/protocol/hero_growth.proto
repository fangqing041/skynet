syntax = "proto3";

package pb_hero_growth;

message HeroGrowthInfo {
  int32 hero_id = 1;
  int32 level = 2;
}

message HeroGrowthAllInfo {
  repeated HeroGrowthInfo heroes = 1;
}

message HERO_GROWTH_C_LEVEL_UP {
  int32 hero_id = 1;
}

message HERO_GROWTH_S_LEVEL_UP {
  HeroGrowthInfo info = 1;
}

message HERO_GROWTH_S_UPDATE {
  repeated HeroGrowthInfo heroes = 1;
}
