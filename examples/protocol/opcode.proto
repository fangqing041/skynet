		CAMPAIGN_S_BLESSING_CHOICE = 154;
		CAMPAIGN_C_BLESSING_REFRESH = 155;
		CAMPAIGN_S_BLESSING_REFRESH = 156;

		HERO_GROWTH_C_LEVEL_UP = 160;
		HERO_GROWTH_S_LEVEL_UP = 161;
		HERO_GROWTH_S_UPDATE = 162;

