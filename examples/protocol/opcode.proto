		SCENE_C_SEARCH_PATH = 1001;//寻路
		SCENE_S_SEARCH_PATH = 1002;//移动
		SCENE_C_MOVE = 1003;//移动
		SCENE_S_MOVE = 1004;//移动
		SCENE_C_MOVE_STOP = 1005;//停止移动
		SCENE_S_MOVE_STOP = 1006;//移动
		SCENE_S_UNIT_STOP = 1007;//场景单位停止视野广播消息
		SCENE_C_RANGE_UNIT = 1008;//视野范围单位信息
		SCENE_S_RANGE_UNIT = 1009;//视野范围单位信息返回
