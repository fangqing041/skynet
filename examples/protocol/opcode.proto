syntax = "proto3";

package pb_opcode;

message OPCODE
{
	enum Enum
	{
		NONE = 0;

		//login 1-50
		LOGIN_C_LOGIN		= 1;
		LOGIN_S_LOGIN		= 2;
		LOGIN_C_CREATE_ROLE = 3; // 第一阶段引导完成后，请求创角：兼容旧版本，新版本不用弹面板，直接发送创角，不需要名字和性别参数
		LOGIN_S_CREATE_ROLE = 4;
		LOGIN_C_REGISTER 	= 5;
		LOGIN_S_REGISTER 	= 6;
		LOGIN_C_PING 		= 7;
		LOGIN_S_PONG 		= 8;
		LOGIN_C_RECONNECT 	= 9;
		LOGIN_S_RECONNECT 	= 10;
		LOGIN_C_GUIDE_START	= 11;
		LOGIN_S_GUIDE_START	= 12;
		LOGIN_C_UPDATE_LANG = 13;
		LOGIN_S_UPDATE_LANG = 14;
        LOGIN_C_CREATE_NAME = 15; // 第二阶段引导完成后弹创角面板，发送名字和性别过来
        LOGIN_S_CREATE_NAME = 16;

		LOGIN_END			= 50;

