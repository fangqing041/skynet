		ITEM_C_ITEM_SALE        = 1701; //物品出售请求
		ITEM_S_ITEM_SALE        = 1702; //物品出售结果
		ITEM_C_ITEM_USE         = 1703; //物品使用请求
		ITEM_S_ITEM_USE         = 1704; //物品使用结果
		ITEM_C_ITEM_COMPOSE     = 1705; //合成请求
		ITEM_S_ITEM_COMPOSE     = 1706; //合成结果
		ITEM_S_ITEM_UPDATE      = 1707; //背包物品更新
		ITEM_S_ITEM_BUFF_UPDATE = 1708; //物品BUFF更新，比如双倍金币
		ITEM_S_ITEM_TIPS        = 1709; //背包内部提示，根据错误码弹提示
		ITEM_C_REDEEM_CODE      = 1710; //兑换激活码请求
		ITEM_S_REDEEM_CODE      = 1711; //兑换激活码返回

		ITEM_END                = 1800;

		//arms 1801-1900
		ARMS_C_PUT_ITEM         = 1801;
		ARMS_S_PUT_ITEM         = 1802;
		ARMS_C_UPGRADE          = 1803;
		ARMS_S_UPGRADE          = 1804;

		ARMS_END               = 1900;


