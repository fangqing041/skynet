syntax = "proto3";

package pb_scene;

import "common.proto";

message UNIT_STATUS {
    enum Enum {
        NONE = 0;
        XING_JUN = 1;//行军
        ZHU_JUN = 2;//驻军
        BATTLE = 3; // 战斗中
        CHE_TUI = 4; // 撤退
    }
}

message UNIT_TYPE {
    enum Enum {
        NONE = 0;
        TEAM = 1;
    }
}

message PathNode {
    int32 x = 1;
    int32 y = 2;
}

message SCENE_C_SEARCH_PATH {
    PathNode from = 1;
    PathNode to = 2;
}

message SCENE_S_SEARCH_PATH {
    repeated PathNode paths = 1;
}

message SCENE_C_MOVE {
    PathNode from = 1;
    PathNode to = 2;
    int32 team_index = 3;
}

message SCENE_S_MOVE {
    MoveInfo move_info = 1;
    SceneUnitInfo unit_info = 2;
}

message SCENE_C_MOVE_STOP {
    PathNode position = 1;
    int32 team_index = 2;
}

message SCENE_S_MOVE_STOP {
    PathNode position = 1;
    SceneUnitInfo unit_info = 2;
}

//场景单位停止视野广播消息
message SCENE_S_UNIT_STOP {
    SceneUnitInfo unit_info = 1;
    PathNode position = 2;
}

message MoveInfo {
    repeated PathNode path_nodes = 1;
    int64 move_start_time = 2;
    int32 move_speed = 3;
}

message SceneUnitInfo {
    int32 unit_id = 1;
    string avatar = 2;
    int32 x = 3;
    int32 y = 4;
    int64 camp_id = 5;
    int64 player_id = 6;
    MoveInfo move_info = 7;//单位移动路径
    int32 status = 8;//单位状态 UNIT_STATUS
    repeated int32 hero_ids = 9;//英雄列表
    int32 unit_type = 10;//单位类型 UNIT_TYPE
}

message SCENE_C_RANGE_UNIT {
    int32 center_x = 1;
    int32 center_y = 2;
    int32 range = 3;
}

message SCENE_S_RANGE_UNIT {
    repeated SceneUnitInfo units = 1;
}

message SCENE_S_UNIT_ADD {
    repeated SceneUnitInfo units = 1;
}

message SCENE_S_UNIT_REMOVE {
    repeated SceneUnitInfo units = 1;
}

message SCENE_S_UPDATE {
    repeated SceneUnitInfo units = 1;
}

message ScenePveInfo {
    message LevelInfo {
        int32 level_id = 1;
        bool recv = 2;
    }
    repeated LevelInfo levels = 1;
}

message SCENE_C_LEVEL_REWARD {
    int32 level_id = 1;
}

message SCENE_S_LEVEL_REWARD {
    int32 level_id = 1;
    pb_common.RewardInfo first_rewards = 2; // 奖励 key：奖励类型 value：奖励数量
    pb_common.RewardInfo fixed_rewards = 3; // 奖励 key：奖励类型 value：奖励数量
    pb_common.RewardInfo random_rewards = 4; // 奖励 key：奖励类型 value：奖励数量
}

message SCENE_S_LEVEL_UPDATE {
    ScenePveInfo.LevelInfo level_info = 1;
}